# Herramienta manual: explora o descarga imágenes de la Arcane Wiki (Fandom) con
# scripts/arte-wiki.py y guarda el resultado en la rama «arte-candidatos» (carpeta salida/)
# para revisarlo antes de pasar nada al juego.
name: Descargar arte de Arcane
on:
  workflow_dispatch:
    inputs:
      pedido:
        description: 'Pedido en JSON (ver scripts/arte-wiki.py)'
        required: true
permissions:
  contents: write
concurrency: arte
jobs:
  arte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pillow
      - name: Explorar o descargar
        env:
          PEDIDO: ${{ inputs.pedido }}
        run: python3 scripts/arte-wiki.py
      - name: Guardar resultados en la rama arte-candidatos
        run: |
          mv salida /tmp/salida
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          if git fetch -q --depth=1 origin arte-candidatos; then git checkout -q -B arte-candidatos FETCH_HEAD; else git checkout -q --orphan arte-candidatos; git rm -rqf .; fi
          mkdir -p "salida/run-${GITHUB_RUN_NUMBER}" && cp -r /tmp/salida/. "salida/run-${GITHUB_RUN_NUMBER}/"
          git add salida
          git commit -qm "arte: resultados del pedido ${GITHUB_RUN_NUMBER}"
          git push -q origin arte-candidatos
