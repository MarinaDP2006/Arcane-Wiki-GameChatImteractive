# Herramienta manual: descarga imágenes de la Arcane Wiki (Fandom) en la rama elegida.
# Lee tools/pedido.json de esa rama y sube el resultado a la carpeta salida/ de la misma rama.
name: Descargar arte de Arcane
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: arte
jobs:
  arte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pillow
      - run: python3 tools/arte.py
      - name: Guardar resultados en la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add salida
          git commit -m "arte: resultados del pedido" || exit 0
          for i in 1 2 3; do git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
