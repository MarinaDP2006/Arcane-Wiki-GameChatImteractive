# Publica la web del juego (carpeta web/) en GitHub Pages cada vez que cambia en main.
# También se vuelve a publicar al cambiar los datos del juego, para que versión, personajes
# y lugares estén siempre al día. Primera vez: Settings → Pages → Source: «GitHub Actions».
name: Publicar web
on:
  push:
    branches: [main]
    paths: ['web/**', 'src/data/**', 'src/img/arte/**', 'scripts/build-web.js', 'package.json']
  pull_request:
    paths: ['web/**', 'scripts/build-web.js']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Montar la web con los datos del juego
        run: node scripts/build-web.js
      - name: Comprobar que no quedan huecos sin rellenar
        run: "! grep -n '{{[A-Z_]*}}' web-dist/*.html"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
