# Compilación y validación exclusiva para Windows.
name: Compilar Windows
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Comprobar datos del juego
        run: npm run check
      - name: Verificar sintaxis del motor
        shell: pwsh
        run: |
          node --check main.js
          node --check preload.js
          node --check src/js/world3d.js
          node --check src/js/world.js
      - name: Compilar instalador y portable de Windows
        run: npm run dist:win -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Comprobar que existen ejecutables
        shell: pwsh
        run: |
          $files = @(Get-ChildItem dist -Filter '*.exe')
          if ($files.Count -lt 2) { throw 'No se han generado ambos ejecutables de Windows' }
          $files | ForEach-Object { Write-Host $_.Name $_.Length }
      - uses: actions/upload-artifact@v4
        with:
          name: grietas-and-gears-windows
          path: dist/*.exe
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: grietas-and-gears-windows
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
