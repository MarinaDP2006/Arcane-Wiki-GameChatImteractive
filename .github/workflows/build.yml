# Versión de escritorio: instalador y portable de Windows + DMG/ZIP de Mac.
# Se compila desde main, en versiones v* y manualmente; sin ramas duplicadas.
name: Compilar escritorio (Windows y Mac)
on:
  push:
    branches: [claude/project-thread-9huivc-arcane]
    tags: ['arcane-v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: escritorio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Comprobar datos del juego
        run: npm run check
      - name: Verificar sintaxis del motor
        shell: pwsh
        run: |
          node --check main.js
          node --check modelos.js
          node --check preload.js
          node --check src/js/world3d.js
          node --check src/js/world.js
          node --check src/js/avatars3d.js
          node --check src/js/game.js
          node --check src/js/app.js
          node --check src/js/util.js
          node --check src/js/zaun-interiors.js
          node --check src/js/piltover-interiors.js
          node --check src/data/story-expansion.js
          node --check src/data/alternate-fates.js
          node --check src/data/chat-expansion.js
          node --check src/data/chat-deep.js
          node --check src/data/arcane-lore.js
      - name: Compilar instalador y portable de Windows
        run: npm run dist:win -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Comprobar que existen ejecutables
        shell: pwsh
        run: |
          $files = @(Get-ChildItem dist -Filter '*.exe')
          if ($files.Count -lt 2) { throw 'No se han generado ambos ejecutables de Windows' }
          $files | ForEach-Object { Write-Host $_.Name $_.Length }
      - uses: actions/upload-artifact@v4
        with:
          name: grietas-and-gears-windows
          path: dist/*.exe
          if-no-files-found: error
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Comprobar datos del juego
        run: npm run check
      # Sin certificado de Apple: la app sale sin firmar. La primera vez en el Mac hay que
      # abrirla con clic derecho → Abrir (lo explica la web y el README).
      - name: Compilar DMG y ZIP de Mac (Intel y Apple Silicon)
        run: npm run dist:mac -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Comprobar que existen los DMG
        run: |
          ls -la dist
          test "$(ls dist/*.dmg | wc -l)" -ge 2
      - uses: actions/upload-artifact@v4
        with:
          name: grietas-and-gears-mac
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/arcane-v')
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: grietas-and-gears-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
