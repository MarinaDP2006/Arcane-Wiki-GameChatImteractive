# Versión móvil: APK de Android para móvil y tablet.
# Se compila desde main, en versiones v* y manualmente; sin ramas duplicadas.
# Sin llave de firma sale un APK de prueba (debug) que se instala directamente en la tablet.
# Con los secretos ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS y
# ANDROID_KEY_PASSWORD también se genera el APK firmado y el AAB para Google Play.
name: Compilar móvil (Android)
on:
  push:
    branches: [claude/project-thread-9huivc-arcane]
    tags: ['arcane-v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: movil-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Instalar dependencias (sin descargar Electron)
        run: npm ci --ignore-scripts
      - name: Comprobar datos del juego
        run: npm run check
      - name: Copiar el juego al proyecto Android
        run: npm run android:sync
      - name: Compilar APK de prueba (debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          mkdir -p ../apk
          cp app/build/outputs/apk/debug/app-debug.apk "../apk/grietas-and-gears-$(node -p "require('../package.json').version")-tablet.apk"
      - name: Compilar APK firmado y AAB (si hay llave)
        if: ${{ env.KEYSTORE != '' }}
        env:
          ANDROID_KEYSTORE_FILE: release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          echo "$KEYSTORE" | base64 -d > release.keystore
          ./gradlew assembleRelease bundleRelease --no-daemon
          v=$(node -p "require('../package.json').version")
          cp app/build/outputs/apk/release/app-release.apk "../apk/grietas-and-gears-$v-firmado.apk"
          cp app/build/outputs/bundle/release/app-release.aab "../apk/grietas-and-gears-$v.aab"
          rm release.keystore
      - name: Comprobar que existe el APK
        run: ls -la apk && test -n "$(ls apk/*.apk)"
      - uses: actions/upload-artifact@v4
        with:
          name: grietas-and-gears-android
          path: apk/*
          if-no-files-found: error
      - name: Adjuntar a la versión publicada
        if: startsWith(github.ref, 'refs/tags/arcane-v')
        uses: softprops/action-gh-release@v2
        with:
          files: apk/*
