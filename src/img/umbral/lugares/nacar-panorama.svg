<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Nácar, ciudad bajo la piedra</title>
<desc id="desc">Panorama original de una ciudad subterránea de talleres, canales y puentes bajo una bóveda rocosa, iluminada por lámparas ámbar y cristales de Resonancia verde azulado.</desc>
<defs>
 <linearGradient id="cave" x2="0" y2="1"><stop stop-color="#07151d"/><stop offset=".35" stop-color="#12313a"/><stop offset=".7" stop-color="#0e2526"/><stop offset="1" stop-color="#030c12"/></linearGradient>
 <linearGradient id="rock" x2=".3" y2="1"><stop stop-color="#34484b"/><stop offset=".42" stop-color="#17282b"/><stop offset="1" stop-color="#070e13"/></linearGradient>
 <linearGradient id="metal" x2="0" y2="1"><stop stop-color="#9d8a60"/><stop offset=".35" stop-color="#4f584b"/><stop offset="1" stop-color="#111c1b"/></linearGradient>
 <linearGradient id="water" x2="0" y2="1"><stop stop-color="#79e5d7" stop-opacity=".7"/><stop offset=".22" stop-color="#164d55"/><stop offset="1" stop-color="#06151d"/></linearGradient>
 <linearGradient id="crystal" x2="0" y2="1"><stop stop-color="#c1fff2"/><stop offset=".35" stop-color="#54e6d0"/><stop offset="1" stop-color="#1c6b82"/></linearGradient>
 <radialGradient id="caveglow"><stop stop-color="#48e3d0" stop-opacity=".52"/><stop offset="1" stop-color="#48e3d0" stop-opacity="0"/></radialGradient>
 <radialGradient id="lamp"><stop stop-color="#fff2b9"/><stop offset=".18" stop-color="#ffc16b" stop-opacity=".9"/><stop offset="1" stop-color="#ff8e3a" stop-opacity="0"/></radialGradient>
 <filter id="soft"><feGaussianBlur stdDeviation="15"/></filter>
 <filter id="shine"><feGaussianBlur stdDeviation="5"/></filter>
 <pattern id="windows" width="30" height="34" patternUnits="userSpaceOnUse"><rect x="10" y="8" width="7" height="12" rx="2" fill="#ffd18a" opacity=".9"/></pattern>
</defs>
