<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Nácar — ciudad subterránea de Resonancia</title><desc id="desc">Panorámica original de una ciudad excavada en la roca, con canales reflectantes, talleres, tuberías y jardines de musgo iluminados por cristales verdes.</desc>
<defs>
 <linearGradient id="cave" x2="0" y2="1"><stop stop-color="#07121c"/><stop offset=".42" stop-color="#102c32"/><stop offset=".7" stop-color="#113a34"/><stop offset="1" stop-color="#071015"/></linearGradient>
 <linearGradient id="water" x2="0" y2="1"><stop stop-color="#247c72"/><stop offset=".35" stop-color="#0d3935"/><stop offset="1" stop-color="#031014"/></linearGradient>
 <linearGradient id="metal" x2="1" y2="1"><stop stop-color="#4d6867"/><stop offset=".45" stop-color="#14282c"/><stop offset="1" stop-color="#060c12"/></linearGradient>
 <radialGradient id="res"><stop stop-color="#83f5c6" stop-opacity=".9"/><stop offset=".38" stop-color="#2ec4a1" stop-opacity=".35"/><stop offset="1" stop-color="#1ebf9b" stop-opacity="0"/></radialGradient>
 <radialGradient id="lantern"><stop stop-color="#ffd19a" stop-opacity=".9"/><stop offset="1" stop-color="#ffad72" stop-opacity="0"/></radialGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="30"/></filter>
 <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" seed="29"/><feColorMatrix values=".25 0 0 0 .25 .0 .25 0 0 .4 0 0 .18 0 .3 0 0 0 .18 0"/></filter>
 <pattern id="lights" width="60" height="64" patternUnits="userSpaceOnUse"><rect x="12" y="12" width="8" height="20" rx="3" fill="#69e9bb" opacity=".8"/><rect x="34" y="16" width="7" height="12" rx="3" fill="#ffb48a" opacity=".7"/></pattern>
</defs>
<rect width="1600" height="900" fill="url(#cave)"/>
