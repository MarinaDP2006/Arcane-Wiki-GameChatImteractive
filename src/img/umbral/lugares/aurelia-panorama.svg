<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Aurelia al amanecer</title>
<desc id="desc">Panorama original de una ciudad elevada de piedra clara y latón, con observatorios, puentes colgantes y ascensores de contrapesos sobre un mar de nubes.</desc>
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#172c53"/><stop offset=".42" stop-color="#e6a66d"/><stop offset=".68" stop-color="#f8d49b"/><stop offset="1" stop-color="#7e95ad"/></linearGradient>
 <linearGradient id="stone" x2=".15" y2="1"><stop stop-color="#f4dfb0"/><stop offset=".55" stop-color="#bfa174"/><stop offset="1" stop-color="#594f4c"/></linearGradient>
 <linearGradient id="shadowStone" x2="0" y2="1"><stop stop-color="#7f8eaa"/><stop offset="1" stop-color="#25334f"/></linearGradient>
 <linearGradient id="gold" x2="0" y2="1"><stop stop-color="#fff1b3"/><stop offset=".4" stop-color="#c89745"/><stop offset="1" stop-color="#684221"/></linearGradient>
 <linearGradient id="clouds" x2="0" y2="1"><stop stop-color="#fff2ce" stop-opacity=".85"/><stop offset="1" stop-color="#b1c2d6" stop-opacity=".08"/></linearGradient>
 <radialGradient id="sun"><stop stop-color="#fff8db"/><stop offset=".24" stop-color="#ffe3aa" stop-opacity=".9"/><stop offset="1" stop-color="#ffd49a" stop-opacity="0"/></radialGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="18"/></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="4"/></filter>
 <pattern id="windows" width="28" height="34" patternUnits="userSpaceOnUse"><rect x="10" y="7" width="6" height="14" rx="2" fill="#ffe2a0" opacity=".85"/></pattern>
</defs>
