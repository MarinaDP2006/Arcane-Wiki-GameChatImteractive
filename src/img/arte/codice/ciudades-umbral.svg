<title id="t">Aurelia y Nácar, concepto visual de Las ciudades del Umbral</title>
<desc id="d">Una ciudad elevada de piedra clara y latón al atardecer contrasta con una ciudad subterránea de metal, canales y luces verde turquesa. Abajo, siluetas originales de personajes con ropa, peinados y paletas distintas.</desc>
