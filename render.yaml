services:
  - type: web
    name: rifts-gears-arcane
    runtime: node
    plan: free
    buildCommand: node scripts/build-web.js
    startCommand: node server/roleplay-server.js
    autoDeployTrigger: commit
    envVars:
      - key: OLLAMA_API_KEY
        sync: false
      - key: OLLAMA_MODEL
        value: gemma4:31b
      - key: ROLEPLAY_RPM
        value: "20"
      - key: NODE_VERSION
        value: "22"
