services:
  - type: web
    name: las-ciudades-del-umbral
    runtime: node
    plan: free
    buildCommand: npm ci && npm run web
    startCommand: node server/index.js
    autoDeployTrigger: commit
    envVars:
      - key: OLLAMA_API_KEY
        sync: false
      - key: OLLAMA_MODEL
        value: gemma4:31b
      - key: ROLEPLAY_MAX_PER_HOUR
        value: "24"
      - key: NODE_VERSION
        value: "22"
