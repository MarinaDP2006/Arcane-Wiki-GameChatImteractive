services:
  - type: web
    name: rifts-gears-arcane
    runtime: node
    plan: free
    buildCommand: npm ci && npm run web
    startCommand: node server/roleplay-server.js
    autoDeployTrigger: commit
    envVars:
      - key: OLLAMA_API_KEY
        sync: false
      - key: OLLAMA_MODEL
        value: gemma4:31b
      - key: ROLEPLAY_MAX_PER_HOUR
        value: "24"
      - key: NODE_VERSION
        value: "22"
