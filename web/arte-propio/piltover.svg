<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <!-- Ilustración original de Piltover para la web: cielo de tarde, torres de latón y un dirigible. -->
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3a6b"/>
      <stop offset=".45" stop-color="#c98a5a"/>
      <stop offset=".75" stop-color="#f3cf8a"/>
      <stop offset="1" stop-color="#f7e2b0"/>
    </linearGradient>
    <radialGradient id="sol" cx=".72" cy=".62" r=".35">
      <stop offset="0" stop-color="#fff4d0" stop-opacity=".95"/>
      <stop offset=".35" stop-color="#ffd98a" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lejos" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a6a7a"/>
      <stop offset="1" stop-color="#b08a78"/>
    </linearGradient>
    <linearGradient id="medio" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3f52"/>
      <stop offset="1" stop-color="#3a2a3e"/>
    </linearGradient>
    <linearGradient id="cerca" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1d2e"/>
      <stop offset="1" stop-color="#160f1c"/>
    </linearGradient>
    <linearGradient id="laton" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a6524"/>
      <stop offset=".5" stop-color="#e7c46a"/>
      <stop offset="1" stop-color="#8a6524"/>
    </linearGradient>
    <linearGradient id="agua" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9b483"/>
      <stop offset="1" stop-color="#3b3350"/>
    </linearGradient>
    <filter id="bruma"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="grano">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4"/>
      <feColorMatrix values="0 0 0 0 .5  0 0 0 0 .4  0 0 0 0 .3  0 0 0 .08 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#cielo)"/>
  <rect width="1600" height="900" fill="url(#sol)"/>

  <!-- Nubes pintadas -->
  <g fill="#fbe7c3" opacity=".55" filter="url(#bruma)">
    <ellipse cx="260" cy="210" rx="220" ry="38"/>
    <ellipse cx="420" cy="180" rx="160" ry="30"/>
    <ellipse cx="1180" cy="150" rx="260" ry="34"/>
    <ellipse cx="1380" cy="190" rx="170" ry="26"/>
  </g>

  <!-- Dirigible -->
  <g transform="translate(980 230)">
    <ellipse cx="0" cy="0" rx="150" ry="42" fill="#5a4048"/>
    <ellipse cx="-10" cy="-12" rx="130" ry="20" fill="#7a5a5c" opacity=".7"/>
    <path d="M-150 0h300M-120-30v60M-60-40v80M0-42v84M60-40v80M120-30v60" stroke="#3c2a34" stroke-width="2" opacity=".6"/>
    <path d="M140-6l40-22v56l-40-22z" fill="#4a3440"/>
    <path d="M-50 40h100l-12 26h-76z" fill="#3c2a34"/>
    <path d="M-40 40l-10-8M40 40l10-8" stroke="#3c2a34" stroke-width="3"/>
    <rect x="-34" y="48" width="68" height="6" fill="#e7c46a" opacity=".7"/>
  </g>

  <!-- Ciudad lejana -->
  <g fill="url(#lejos)" opacity=".85">
    <path d="M0 560V470h40v-30h30v40h50v-70h20v-30h10v30h20v70h60v-50h40v-40l20-30 20 30v40h30v80h50v-110h16v-40h8v40h16v110h60v-60h50v-30h40v30h40v-90l25-40 25 40v90h50v50h60v-70h30v-60h12v60h30v70h60v-40h50v-80l30-50 30 50v80h40v60h60v-50h50v-30h30v30h40v80h50v-60h40v-40h20v40h40v70h60V560z"/>
  </g>

  <!-- Torre del reloj y edificios medios -->
  <g fill="url(#medio)">
    <path d="M0 640V560h70v-40h60v40h40v-70h80v70h50v-30h70v100z"/>
    <path d="M330 640V430h20v-40h70v40h20v210z"/>
    <path d="M345 390l40-90 40 90z"/>
    <path d="M440 640V520h90v-60h40v-30l30-40 30 40v30h40v60h70v120z"/>
    <path d="M1060 640V500h60v-80h20v-60l20-40 20 40v60h20v80h60v140z"/>
    <path d="M1260 640V540h100v-50h60v50h80v-30h100v130z"/>
  </g>
  <g transform="translate(385 470)">
    <circle r="30" fill="#f3d58f" stroke="url(#laton)" stroke-width="6"/>
    <path d="M0 0V-20M0 0l14 8" stroke="#3a2a3e" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- Ventanas encendidas -->
  <g fill="#ffd98a" opacity=".85">
    <rect x="470" y="545" width="10" height="16"/><rect x="495" y="545" width="10" height="16"/><rect x="620" y="560" width="10" height="16"/>
    <rect x="650" y="560" width="10" height="16"/><rect x="1085" y="530" width="8" height="14"/><rect x="1110" y="560" width="8" height="14"/>
    <rect x="1290" y="570" width="10" height="16"/><rect x="1320" y="570" width="10" height="16"/><rect x="1450" y="590" width="10" height="16"/>
    <rect x="80" y="590" width="10" height="16"/><rect x="190" y="560" width="10" height="16"/>
  </g>

  <!-- Agua con reflejos -->
  <rect y="640" width="1600" height="260" fill="url(#agua)"/>
  <g stroke="#ffe3a8" stroke-width="3" opacity=".5" stroke-linecap="round">
    <path d="M1080 680h140M1120 705h90M1050 730h170M1140 760h70M300 700h80M720 720h60M1400 690h90"/>
  </g>

  <!-- Puente levadizo de latón -->
  <g>
    <path d="M0 700h1600v22H0z" fill="#2a1d2e"/>
    <path d="M0 700h1600" stroke="url(#laton)" stroke-width="4"/>
    <g fill="url(#cerca)">
      <path d="M250 900V560h36v-30h44v30h36v340z"/>
      <path d="M1230 900V560h36v-30h44v30h36v340z"/>
    </g>
    <g fill="#e7c46a">
      <path d="M268 560l40-60 40 60z"/><path d="M1248 560l40-60 40 60z"/>
    </g>
    <path d="M366 600Q800 470 1230 600" fill="none" stroke="url(#laton)" stroke-width="6"/>
    <g stroke="#e7c46a" stroke-width="2" opacity=".75">
      <path d="M430 585V700M500 566V700M570 551V700M640 540V700M710 532V700M780 528V700M850 528V700M920 533V700M990 541V700M1060 553V700M1130 569V700"/>
    </g>
    <rect x="286" y="600" width="44" height="300" fill="#3a2a3e"/>
    <rect x="1266" y="600" width="44" height="300" fill="#3a2a3e"/>
    <g fill="#5ad4f0" opacity=".9">
      <path d="M308 640l10 16-10 16-10-16z"/><path d="M1288 640l10 16-10 16-10-16z"/>
    </g>
  </g>

  <!-- Primer plano: cornisas y farolas -->
  <g fill="url(#cerca)">
    <path d="M0 900V760h120v-30h60v30h80v140z"/>
    <path d="M1400 900V780h80v-40h120v160z"/>
  </g>
  <g>
    <path d="M200 900V780" stroke="#1a121e" stroke-width="8"/>
    <circle cx="200" cy="770" r="14" fill="#ffe3a8"/>
    <circle cx="200" cy="770" r="40" fill="#ffd98a" opacity=".25" filter="url(#bruma)"/>
    <path d="M1450 900V770" stroke="#1a121e" stroke-width="8"/>
    <circle cx="1450" cy="760" r="14" fill="#ffe3a8"/>
    <circle cx="1450" cy="760" r="40" fill="#ffd98a" opacity=".25" filter="url(#bruma)"/>
  </g>

  <rect width="1600" height="900" filter="url(#grano)" opacity=".6"/>
</svg>
